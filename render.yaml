services:
  # Backend Spring Boot Web Service
  - type: web
    name: suraksha-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/relocation/habitats
    envVars:
      - key: PORT
        value: 8080

  # Frontend React Static Site
  - type: web
    name: suraksha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: suraksha-backend
          property: host
