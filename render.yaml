services:
  # -------------------------------------------------------------
  # 1. Spring Boot 3.3.4 Relocation & Carrying-Capacity Engine
  # -------------------------------------------------------------
  - type: web
    name: suraksha-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthCheckPath: /api/v1/habitations

  # -------------------------------------------------------------
  # 2. React 18 + Vite + Leaflet Enterprise Operations Center
  # -------------------------------------------------------------
  - type: web
    name: suraksha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: suraksha-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
