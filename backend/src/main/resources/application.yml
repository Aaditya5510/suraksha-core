# SURAKSHA Core Decision Engine - Application Configuration
server:
  port: 8080

spring:
  application:
    name: suraksha-engine

  datasource:
    url: jdbc:h2:mem:surakshadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

logging:
  level:
    com.suraksha.engine: INFO
    org.springframework.web: INFO
