# SURAKSHA Core Decision Engine - Application Properties
server.port=8080

# Spring Application Metadata
spring.application.name=suraksha-engine

# In-Memory H2 Database Configuration (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:surakshadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Seed Initialization
spring.sql.init.mode=always

# H2 Console Configuration (Tactical Inspection Endpoint)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging Configuration
logging.level.com.suraksha.engine=INFO
logging.level.org.springframework.web=INFO
